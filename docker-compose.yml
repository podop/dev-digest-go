# DevDigest (Go backend): three containers — database, backend, frontend.
#   docker compose up -d --build      start everything
#   docker compose ps                 health of each service
# Ports bind to loopback only: the API has no auth and the DB uses default credentials.
# Never `docker compose down -v` unless you mean it: it deletes the database volume.
name: devdigest-go

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdigest
      POSTGRES_PASSWORD: devdigest
      POSTGRES_DB: devdigest
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdigest -d devdigest"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      # Build-time only: parallel downloads (go mod, npm) get reset on the default bridge
      # network under WSL2; the running containers still use the compose network.
      network: host
      args:
        # Source commit stamped into the embedded CI runner (12 hex, set by `make`, which passes it
        # only for a clean tree); anything else builds "dev".
        DEVDIGEST_BUILD_ID: ${DEVDIGEST_BUILD_ID:-dev}
    restart: unless-stopped
    env_file:
      - path: .env          # optional: LLM keys, GITHUB_TOKEN (see .env.example)
        required: false
    environment:
      API_ADDR: ":3001"
      DATABASE_URL: postgres://devdigest:devdigest@db:5432/devdigest?sslmode=disable
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3100},http://127.0.0.1:${WEB_PORT:-3100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Secrets file (/data/secrets.json) and clone root (/data/workspace) live on the
      # backend_data volume, so they survive container restarts and rebuilds.
      DEVDIGEST_DATA_DIR: /data
      # Startup switches: migrations and seed run before listening unless set to false.
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      DB_AUTO_SEED: ${DB_AUTO_SEED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Repo-intel read port only; indexing runs either way. Off only on the literal `false`.
      REPO_INTEL_ENABLED: ${REPO_INTEL_ENABLED:-true}
      # Review intent pre-work (one extra LLM call per review on a cache miss). Off only on the literal `false`.
      REVIEW_INTENT_ENABLED: ${REVIEW_INTENT_ENABLED:-true}
      # Background PR poll for the leaderboard (interval = Settings polling_interval_min). Off only on the literal `false`.
      PR_POLL_ENABLED: ${PR_POLL_ENABLED:-true}
      # LLM mock for demos and tests (empty = real providers; the only other value is `mock`),
      # its per-call delay in ms, and the project-context file globs (empty = built-in default).
      LLM_PROVIDER_OVERRIDE: ${LLM_PROVIDER_OVERRIDE:-}
      LLM_MOCK_DELAY_MS: ${LLM_MOCK_DELAY_MS:-0}
      PROJECT_CONTEXT_GLOBS: ${PROJECT_CONTEXT_GLOBS:-}
      # Parallelism of a review request: agents at once (1-20) and map-reduce chunks at once (1-16).
      REVIEW_AGENT_CONCURRENCY: ${REVIEW_AGENT_CONCURRENCY:-4}
      REVIEW_MAP_CONCURRENCY: ${REVIEW_MAP_CONCURRENCY:-3}
      # Size of the Postgres connection pool (1-90); Postgres allows 100 connections in total.
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
    # Shutdown grace is 20 s in the app (requests) plus up to 10 s for running jobs; docker's
    # default 10 s would SIGKILL it mid-shutdown.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${API_PORT:-3101}:3001"
    volumes:
      - backend_data:/data   # repository clones + local secrets file
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      network: host   # see backend.build.network
      args:
        # The browser calls the API directly, so this is the host-side URL.
        NEXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-3101}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    name: devdigest_go_pgdata
  backend_data:
    name: devdigest_go_backend_data
